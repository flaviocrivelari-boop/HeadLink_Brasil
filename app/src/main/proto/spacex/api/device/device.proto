syntax = "proto3";
package SpaceX.API.Device;
option java_package = "com.spacex.api.device";
option java_multiple_files = true;

service Device {
    rpc Handle(Request) returns (Response) {}
}

message Request {
    string target_id = 1000;
    oneof request {
        GetStatusRequest get_status = 1004;
        GetHistoryRequest get_history = 1006;
        GetDeviceInfoRequest get_device_info = 1008;
    }
}

message Response {
    oneof response {
        DishGetStatusResponse dish_get_status = 1006;
        GetHistoryResponse get_history = 1007;
        GetDeviceInfoResponse get_device_info = 1009;
        WifiGetStatusResponse wifi_get_status = 1010;
    }
}

message GetStatusRequest {}
message GetHistoryRequest {}
message GetDeviceInfoRequest {}

message GetDeviceInfoResponse {
    DeviceInfo device_info = 1;
}

message WifiGetStatusResponse {
    DeviceInfo device_info = 1;
    float pop_ping_latency_ms = 2;
    bool internet = 3;
    bool ipv6 = 4;
}

message DeviceInfo {
    string id = 1;
    string hardware_version = 2;
    string software_version = 3;
    int64 generation_number = 5;
    string country_code = 6;
    int32 utc_offset_s = 7;
    int32 boot_count = 10;
    string build_date = 11;
}

message GetHistoryResponse {
    DishHistory dish = 1;
}

message DishHistory {
    float current = 1;
    repeated float pop_ping_drop_rate = 1001;
    repeated float pop_ping_latency_ms = 1002;
    repeated float downlink_throughput_bps = 1003;
    repeated float uplink_throughput_bps = 1004;
    repeated float snr = 1005;
    repeated bool scheduled = 1006;
    repeated bool obstructed = 1007;
}

message DishConfig {
    bool snow_melt_mode = 12;
    bool location_request_mode = 14;
    bool level_dish_mode = 15;
    bool power_save_mode = 16;
}

message DishReadyStates {
    bool cady = 1;
    bool scp = 2;
    bool l1l2 = 3;
    bool xphy = 4;
    bool aap = 5;
    bool rf = 6;
}

message DishGetStatusResponse {
    DeviceInfo device_info = 1;
    DishState state = 2;
    DishAlerts alerts = 3;
    float snr = 4;
    bool currently_obstructed = 5;
    float fraction_obstructed = 6;
    uint32 uptime_s = 7;
    float pop_ping_drop_rate = 10;
    float downlink_throughput_bps = 11;
    float uplink_throughput_bps = 12;
    float pop_ping_latency_ms = 13;
    string software_version = 18;
    float direction_azimuth = 23;
    float direction_elevation = 24;
    bool gps_valid = 25;
    uint32 gps_sats = 26;
    bool on_backup_beam = 27;
    float boresight_azimuth_deg = 28;
    float boresight_elevation_deg = 29;
    float desired_boresight_azimuth_deg = 30;
    float desired_boresight_elevation_deg = 31;
    bool snr_above_noise_floor = 32;
    bool snr_persistently_low = 33;
    float obstruction_duration = 34;
    float obstruction_interval = 35;
    bool time_valid = 36;
    uint32 patches_valid = 37;
    float eth_speed_mbps = 38;
    MobilityClass mobility_class = 39;
    string class_of_service = 40;
    string software_update_state = 41;
    bool is_service_state_ok = 42;
    DishReadyStates ready_states = 1000;
    DishConfig config = 2000;
}

message DishAlerts {
    bool motors_stuck = 1;
    bool thermal_throttle = 3;
    bool slow_ethernet_speeds = 4;
    bool software_install_pending = 5;
    bool moving_while_not_mobile = 8;
    bool low_motor_current = 15;
    bool mast_not_near_vertical = 24;
    bool disk_obstructed = 31;
    bool roaming_no_service = 41;
    bool power_supply_thermal_throttle = 42;
    bool dish_is_heating = 50;
    bool dish_thermal_shutdown = 51;
    bool moving_too_fast_for_policy = 52;
}

enum DishState {
    UNKNOWN = 0;
    CONNECTED = 1;
    SEARCHING = 2;
    BOOTING = 3;
}

enum MobilityClass {
    STATIONARY = 0;
    MOBILE = 1;
    NOMADIC = 2;
}
